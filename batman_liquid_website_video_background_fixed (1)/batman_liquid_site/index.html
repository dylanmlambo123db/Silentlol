<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#030713" />
  <title>Into the Night</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body, body * { cursor: none !important; }
    html, body { width: 100%; min-height: 100%; margin: 0; background: #02040b; }
    body { overflow: hidden; font-family: Arial, Helvetica, sans-serif; }
    .intro {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 480px;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 50% 48%, rgba(31,75,190,.22), transparent 55%),
        #02040b;
    }
    .art {
      position: absolute;
      inset: -3%;
      width: 106%;
      height: 106%;
      object-fit: cover;
      object-position: center;
      filter: url(#liquid) saturate(1.08) contrast(1.06);
      transform: scale(1.035);
      animation: drift 12s ease-in-out infinite alternate;
      will-change: transform, filter;
    }

    .liquid-cross-cursor {
      position: fixed;
      z-index: 20;
      left: 0;
      top: 0;
      width: 52px;
      height: 52px;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      opacity: 1;
      transform: translate(-50%, -50%);
      filter: url(#liquid) drop-shadow(0 0 7px rgba(135, 175, 255, .9)) drop-shadow(0 0 15px rgba(65, 115, 255, .55));
      mix-blend-mode: screen;
      will-change: left, top, transform;
    }
    @media (pointer: coarse) {
      .liquid-cross-cursor { display: none; }
    }
    .shade {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(0,0,0,.16), transparent 27%, transparent 68%, rgba(0,0,0,.34)),
        radial-gradient(ellipse at center, transparent 43%, rgba(0,0,0,.5) 100%);
      z-index: 1;
    }
    .blue-glow {
      position: absolute;
      inset: -20%;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 55%, rgba(35,91,255,.12), transparent 48%);
      mix-blend-mode: screen;
      animation: glow 7s ease-in-out infinite alternate;
    }
    .grain {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: .11;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E");
    }
    .edge {
      position: absolute;
      inset: 12px;
      z-index: 3;
      border: 1px solid rgba(130,165,255,.13);
      pointer-events: none;
    }
    @keyframes drift {
      0% { transform: scale(1.035) translate3d(-.35%, .15%, 0); }
      100% { transform: scale(1.09) translate3d(.35%, -.2%, 0); }
    }
    @keyframes glow {
      from { opacity: .45; transform: translate3d(-1%, 1%, 0) scale(.98); }
      to { opacity: .95; transform: translate3d(1%, -1%, 0) scale(1.04); }
    }



    .intro { transition: opacity 1.1s ease, transform 1.1s ease, filter 1.1s ease; }
    .intro.is-leaving { opacity:0; transform:scale(1.035); filter:blur(12px); pointer-events:none; }
    .enter-hint { position:absolute; z-index:5; left:50%; bottom:34px; transform:translateX(-50%); color:rgba(225,235,255,.8); font-size:11px; letter-spacing:.28em; text-transform:uppercase; text-shadow:0 0 14px rgba(95,145,255,.7); animation:hintPulse 2.4s ease-in-out infinite; pointer-events:none; white-space:nowrap; }
    @keyframes hintPulse { 0%,100%{opacity:.38} 50%{opacity:1} }
    .profile { position:fixed; inset:0; z-index:10; display:grid; place-items:center; padding:28px 18px; overflow-y:auto; opacity:0; visibility:hidden; pointer-events:none; transition:opacity 1.1s ease,visibility 1.1s; background:transparent; isolation:isolate; }
    .profile-video-bg { position:absolute; inset:0; z-index:0; overflow:hidden; background:#000; pointer-events:none; }
    .profile-video-bg::after { content:""; position:absolute; inset:0; background:rgba(0,0,0,.22); pointer-events:none; }
    .profile-video-bg iframe { position:absolute; top:50%; left:50%; width:max(100vw,177.78vh); height:max(100vh,56.25vw); transform:translate(-50%,-50%); border:0; pointer-events:none; }
    .profile.visible { opacity:1; visibility:visible; pointer-events:auto; }
    .profile-inner { position:relative; z-index:2; width:min(100%,470px); margin:auto; color:#f4f5ff; text-shadow:0 2px 18px rgba(0,0,0,.6); }
    .profile-top { display:flex; align-items:center; gap:18px; margin:8px 0 30px; }
    .avatar { width:112px; height:112px; flex:0 0 112px; border-radius:50%; background:#05070d url("assets/batman.jpg") center/cover; border:1px solid rgba(190,210,255,.35); box-shadow:0 0 32px rgba(75,120,255,.22); }
    .profile-name { font-size:25px; font-weight:800; letter-spacing:.02em; }
    .profile-bio { margin-top:8px; color:rgba(230,235,255,.72); font-size:13px; }
    .profile-tag { margin-top:13px; color:rgba(210,225,255,.75); font-size:11px; letter-spacing:.16em; }
    .profile-card { display:flex; align-items:center; gap:15px; margin:13px 0; padding:17px; min-height:94px; border:1px solid rgba(220,230,255,.16); border-radius:25px; background:rgba(225,235,255,.075); box-shadow:inset 0 1px rgba(255,255,255,.08),0 12px 36px rgba(0,0,0,.18); backdrop-filter:blur(15px); }
    .social-icon { display:grid; place-items:center; width:55px; height:55px; flex:0 0 55px; border-radius:17px; background:rgba(5,8,18,.76); color:white; font-size:22px; font-weight:800; border:1px solid rgba(210,225,255,.16); }
    .profile-card h2 { margin:0 0 6px; font-size:16px; }
    .profile-card p { margin:0; color:rgba(230,235,255,.68); font-size:12px; }
    .social-link { display:inline-block; margin-top:8px; color:#fff; text-decoration:none; font-size:11px; font-weight:700; padding:6px 12px; border-radius:20px; background:rgba(83,119,255,.8); }
    .socials-label { margin:27px 0 12px; font-size:10px; letter-spacing:.25em; color:rgba(220,230,255,.62); text-align:center; }
    .social-row { display:flex; justify-content:center; gap:14px; flex-wrap:wrap; }
    .social-pill { display:grid; place-items:center; width:48px; height:48px; border-radius:16px; color:white; text-decoration:none; font-weight:800; border:1px solid rgba(220,230,255,.2); background:rgba(230,238,255,.1); box-shadow:0 0 20px rgba(100,140,255,.13); backdrop-filter:blur(10px); }
    .profile-footer { margin-top:28px; text-align:center; color:rgba(220,230,255,.5); font-size:10px; letter-spacing:.15em; }
    @media(max-width:420px) { .profile{padding:22px 16px}.avatar{width:94px;height:94px;flex-basis:94px}.profile-name{font-size:22px}.profile-card{padding:14px} }

    .soundtrack {
      position: fixed;
      width: 200px;
      height: 200px;
      left: -220px;
      bottom: 0;
      opacity: 0;
      pointer-events: none;
    }
    @media (max-width: 700px) {
      .music-card { left: 16px; bottom: 16px; width: 206px; }
      #music-player, #music-player iframe { width: 186px; height: 105px; }
    }
    @media (max-width: 360px) {
      .music-card { transform: scale(.88); transform-origin: bottom left; }
    }
    @media (max-width: 700px) {
      .art { object-position: 48% center; }
      .edge { inset: 8px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .art, .blue-glow { animation: none; }
    }
  </style>
</head>
<body>
  <main class="intro" aria-label="Batman-inspired animated opening image">
    <svg width="0" height="0" aria-hidden="true" style="position:absolute">
      <filter id="liquid" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.008 0.014"
          numOctaves="2"
          seed="8"
          result="noise">
          <animate attributeName="baseFrequency"
            dur="9s"
            values="0.007 0.012;0.012 0.018;0.008 0.015;0.007 0.012"
            repeatCount="indefinite" />
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="noise"
          scale="13" xChannelSelector="R" yChannelSelector="G">
          <animate attributeName="scale" dur="7s"
            values="8;17;11;8" repeatCount="indefinite" />
        </feDisplacementMap>
      </filter>
    </svg>

    <img class="art" src="assets/batman.jpg" alt="Dark blue illustration of Batman" />
    <div class="blue-glow"></div>
    <div class="shade"></div>
    <div class="grain"></div>
    <div class="edge"></div>
    <div class="enter-hint">CLICK ANYWHERE TO ENTER</div>
    <img id="liquid-cross-cursor" class="liquid-cross-cursor" src="assets/cross-3d.png" alt="" aria-hidden="true" />

    <div id="music-player" class="soundtrack" aria-hidden="true"></div>
  </main>


  <section id="profile" class="profile" aria-label="Social profile">
    <div class="profile-video-bg" aria-hidden="true">
      <iframe
        id="profile-bg-player"
        src="https://www.youtube-nocookie.com/embed/FRtKUKhxXmU?enablejsapi=1&autoplay=1&mute=1&controls=0&loop=1&playlist=FRtKUKhxXmU&playsinline=1&rel=0&modestbranding=1"
        title="Background video"
        allow="autoplay; encrypted-media; picture-in-picture"
        referrerpolicy="strict-origin-when-cross-origin"
        tabindex="-1"></iframe>
    </div>
    <div class="profile-inner">
      <div class="profile-top">
        <div class="avatar" aria-hidden="true"></div>
        <div>
          <div class="profile-name">silent_k77</div>
          <div class="profile-bio">gamer · creator · developer</div>
          <div class="profile-tag">WELCOME TO MY PROFILE</div>
        </div>
      </div>
      <div class="profile-card"><div class="social-icon">✦</div><div><h2>About me</h2><p>Gaming, edits, and projects.</p></div></div>
      <div class="profile-card"><div class="social-icon">▶</div><div><h2>YouTube</h2><p>Add your channel link here</p><a class="social-link" href="#" data-placeholder-link>View channel</a></div></div>
      <div class="socials-label">FIND ME ELSEWHERE</div>
      <div class="social-row">
        <a class="social-pill" href="#" aria-label="Discord" data-placeholder-link>D</a>
        <a class="social-pill" href="#" aria-label="TikTok" data-placeholder-link>♪</a>
        <a class="social-pill" href="#" aria-label="Instagram" data-placeholder-link>◎</a>
        <a class="social-pill" href="#" aria-label="YouTube" data-placeholder-link>▶</a>
      </div>
      <div class="profile-footer">THANKS FOR VISITING</div>
    </div>
  </section>

  <script>

    (function installProfileTransition() {
      const intro = document.querySelector('.intro');
      const profile = document.getElementById('profile');
      let entered = false;
      intro.addEventListener('click', function () {
        if (entered) return;
        entered = true;
        intro.classList.add('is-leaving');
        window.setTimeout(function () { profile.classList.add('visible'); }, 520);
      });
      document.querySelectorAll('[data-placeholder-link]').forEach(function (link) {
        link.addEventListener('click', function (event) { event.preventDefault(); });
      });
    })();

    // Small cross-shaped pointer with the same animated liquid distortion as the background.
    (function installLiquidCrossCursor() {
      const cursor = document.getElementById('liquid-cross-cursor');
      if (!cursor || window.matchMedia('(pointer: coarse)').matches) return;
      let x = window.innerWidth / 2;
      let y = window.innerHeight / 2;
      let targetX = x;
      let targetY = y;
      window.addEventListener('pointermove', function (event) {
        targetX = event.clientX;
        targetY = event.clientY;
        cursor.style.opacity = '1';
      });
      window.addEventListener('pointerleave', function () {
        cursor.style.opacity = '0';
      });
      function animateCursor() {
        x += (targetX - x) * 0.22;
        y += (targetY - y) * 0.22;
        cursor.style.left = x + 'px';
        cursor.style.top = y + 'px';
        requestAnimationFrame(animateCursor);
      }
      animateCursor();
    })();

    // Hidden background soundtrack. Browsers require a user gesture for audio.
    // Remember the first click even if YouTube's player has not finished loading yet.
    let soundtrack;
    let profileVideo;
    let visitorHasInteracted = false;
    let soundtrackStarted = false;
    let profileVideoStarted = false;

    function startSoundtrack() {
      visitorHasInteracted = true;
      if (soundtrack && !soundtrackStarted) {
        try {
          soundtrack.setVolume(16);
          soundtrack.unMute();
          soundtrack.playVideo();
          soundtrackStarted = true;
        } catch (error) { soundtrackStarted = false; }
      }
    }

    function onYouTubeIframeAPIReady() {
      soundtrack = new YT.Player('music-player', {
        width: '200',
        height: '200',
        videoId: '55dz3B4rzaA',
        playerVars: {
          autoplay: 0,
          controls: 0,
          disablekb: 1,
          playsinline: 1,
          rel: 0,
          modestbranding: 1,
          loop: 1,
          playlist: '55dz3B4rzaA'
        },
        events: {
          onReady: function (event) {
            event.target.setVolume(16);
            if (visitorHasInteracted) startSoundtrack();
          },
          onStateChange: function (event) {
            if (event.data === YT.PlayerState.PLAYING) {
              event.target.setVolume(16);
            }
          },
          onError: function (event) {
            console.warn('The background video could not be embedded. YouTube error:', event.data);
          }
        }
      });
    }

    // Don't use { once: true }: a click before player-ready must not be lost.
    document.addEventListener('pointerdown', startSoundtrack);
    document.addEventListener('keydown', startSoundtrack);

    (function loadYouTubeAPI() {
      const tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      tag.async = true;
      document.head.appendChild(tag);
    })();
  </script>
</body>
</html>
